<!DOCTYPE html>
<html>
<head>
  <title>JavaScript</title>
</head>
<body>

<h2>My First JavaScript</h2>

<button type="button" onclick="showDateTime()">
  Click me to display Date and Time.
</button>

<p id="demo"></p>

<script>
function showDateTime() {
  const now = new Date();
  document.getElementById("demo").innerHTML = now.toString();
}
</script>

</body>
</html>
